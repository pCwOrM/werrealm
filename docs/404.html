<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>404 · Neural Pathway Not Found ⚡ Werrealm ($WERR)</title>
  <meta name="description" content="The requested route does not exist in the Werrealm sovereign brain-chain node network. Return to the main portal.">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="256x256" href="/werr-token-logo-256.png">
  <link rel="apple-touch-icon" sizes="256x256" href="https://werrealm.network/werr-token-logo-256.png">
  <style>
    :root {
      --bg: #040711;
      --card-bg: rgba(13, 22, 41, 0.75);
      --card-border: rgba(30, 58, 102, 0.5);
      --primary: #00f2fe;
      --secondary: #4facfe;
      --accent: #10b981;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 30%, #0d1b33 0%, #040711 75%);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 44px 32px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }
    .badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-family: monospace;
      background: rgba(239, 68, 68, 0.12);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
      margin-bottom: 20px;
    }
    h1 {
      font-size: 4rem;
      margin-bottom: 8px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-family: monospace;
      letter-spacing: -2px;
    }
    h2 { font-size: 1.3rem; margin-bottom: 12px; color: #fff; }
    p { font-size: 0.95rem; color: var(--text-muted); line-height: 1.6; margin-bottom: 28px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 28px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #040711;
      text-decoration: none;
      font-weight: 700;
      border-radius: 10px;
      transition: filter 0.2s;
    }
    .btn:hover { filter: brightness(1.1); }
  </style>
</head>
<body>
  <div class="box">
    <div class="badge">404 · ROUTE NOT FOUND</div>
    <h1>404</h1>
    <h2>Neural Pathway Not Found</h2>
    <p>The requested route does not exist in the Werrealm sovereign brain-chain node network. Please return to the genesis portal.</p>
    <a href="/" class="btn">Return to Genesis Portal &rarr;</a>
  </div>
</body>
</html>
